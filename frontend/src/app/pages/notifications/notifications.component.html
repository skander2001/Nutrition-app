<div class="shell">
  <app-admin-sidebar *ngIf="isNutritionniste" active="notifications"></app-admin-sidebar>
  <app-sidebar *ngIf="!isNutritionniste" active="notifications"></app-sidebar>

  <main class="shell-main">
    <app-topbar [userRole]="isNutritionniste ? 'Nutritionniste' : 'Patient'"></app-topbar>

    <div class="page">
      <div class="crumbs">
        <span class="muted">Compte</span>
        <span class="sep">›</span>
        <span>Notifications</span>
      </div>

      <!-- Header -->
      <div class="np-hd">
        <div>
          <h2 class="np-title">Notifications</h2>
          <p class="np-sub" *ngIf="unreadCount > 0">{{ unreadCount }} non lue{{ unreadCount > 1 ? 's' : '' }}</p>
          <p class="np-sub" *ngIf="unreadCount === 0 && !loading">Tout est à jour</p>
        </div>
        <button class="btn" *ngIf="unreadCount > 0" (click)="markAll()">
          Tout marquer comme lu
        </button>
      </div>

      <!-- Loading -->
      <div class="np-empty" *ngIf="loading">
        <div class="np-spinner"></div>
        <p>Chargement…</p>
      </div>

      <!-- Empty -->
      <div class="np-empty" *ngIf="!loading && notifications.length === 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <p>Aucune notification pour le moment.</p>
      </div>

      <!-- List -->
      <div class="card np-card" *ngIf="!loading && notifications.length > 0">
        <div
          class="np-item"
          *ngFor="let n of notifications"
          [class.unread]="!n.lu"
          (click)="open(n)"
        >
          <!-- Type icon -->
          <div class="np-icon" [ngClass]="n.type">
            <svg *ngIf="n.type === 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>
            <svg *ngIf="n.type === 'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
            <svg *ngIf="n.type === 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <svg *ngIf="n.type !== 'success' && n.type !== 'danger' && n.type !== 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>

          <!-- Content -->
          <div class="np-body">
            <div class="np-item-title">{{ n.titre }}</div>
            <div class="np-item-msg" *ngIf="n.message">{{ n.message }}</div>
            <div class="np-item-time">{{ formatTime(n.created_at) }}</div>
          </div>

          <!-- Unread badge -->
          <span class="np-new" *ngIf="!n.lu">Nouveau</span>
        </div>
      </div>

    </div>
  </main>
</div>
