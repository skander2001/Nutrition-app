<div class="topbar">
  <div class="topbar-spacer"></div>
  <div class="topbar-actions">
    <button class="icon-btn" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge-dot"></span>
    </button>

    <div class="me">
      <div class="me-photo">{{ initials }}</div>
      <div>
        <div class="me-name">{{ userName }}</div>
        <div class="me-role">{{ userRole }}</div>
      </div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</div>
